name: Deploy Rosa website

on:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read
  id-token: write

concurrency:
  group: rosa-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-development:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Validate website search metadata and deployment artifacts
        run: |
          python3 -m unittest discover -s tests -p 'test_site*.py'
          node --test tests/test_redirect.cjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/github-actions-deploy-dev
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.3
          terraform_wrapper: false

      - name: Provision development visitor logging
        working-directory: terraform/visitor-logging
        run: |
          terraform init \
            -backend-config="bucket=terraform-state-${{ secrets.AWS_ACCOUNT_ID_DEV }}" \
            -backend-config="key=rosa-website-visitor-logging/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=terraform-state-locks-${{ secrets.AWS_ACCOUNT_ID_DEV }}"
          terraform validate
          terraform plan -input=false -var-file=env-dev.tfvars -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: Provision development HTTPS redirect
        working-directory: terraform/apex-redirect
        run: |
          terraform init \
            -backend-config="bucket=terraform-state-${{ secrets.AWS_ACCOUNT_ID_DEV }}" \
            -backend-config="key=rosa-website-apex-redirect/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=terraform-state-locks-${{ secrets.AWS_ACCOUNT_ID_DEV }}"
          terraform validate
          terraform plan -input=false -var-file=env-dev.tfvars -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: Verify development deployment target
        env:
          BUCKET: www-dev.rosa.bot
          DISTRIBUTION: E1FOKZO6RWD12W
          EXPECTED_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
        run: |
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$actual_account" == "$EXPECTED_ACCOUNT" ]] || { echo "Wrong AWS account: $actual_account" >&2; exit 1; }
          origin="$(aws cloudfront get-distribution --id "$DISTRIBUTION" --query 'Distribution.DistributionConfig.Origins.Items[0].DomainName' --output text)"
          [[ "$origin" == "$BUCKET.s3.amazonaws.com" ]] || { echo "Unexpected CloudFront origin: $origin" >&2; exit 1; }
          echo "Development deployment target verified: account $actual_account, bucket $BUCKET, CloudFront $DISTRIBUTION"

      - name: Prepare development site artifact
        run: python3 scripts/prepare_site.py --environment dev --output site

      - name: Upload development site artifact
        uses: actions/upload-artifact@v7
        with:
          name: rosa-development-site
          path: site/
          if-no-files-found: error
          retention-days: 1

  deploy-development:
    if: github.ref == 'refs/heads/develop'
    needs: prepare-development
    uses: commercesong/org-reusable-workflows/.github/workflows/static-site-deploy.yml@main
    permissions:
      contents: read
      id-token: write
    secrets:
      aws_account_id_dev: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
      # The reusable interface requires both account fields; dev routing never uses this sentinel.
      aws_account_id_prod: 'unused-no-production-account'
    with:
      ref: ${{ github.ref }}
      commit_hash: ${{ github.sha }}
      source_path: site
      github_actions_artifact_name: rosa-development-site
      bucket_name_dev: www-dev.rosa.bot
      bucket_name_prod: unused-no-production-bucket
      s3_upload_rules: |
        [
          {
            "operation": "s3_sync",
            "source_directory": ".",
            "destination_prefix": "",
            "exclude": ["*.html", "rosa.vcf"],
            "cache_control": "public,max-age=3600"
          },
          {
            "operation": "s3_copy",
            "source_file": "rosa.vcf",
            "destination_key": "rosa.vcf",
            "content_type": "text/vcard",
            "content_disposition": "attachment; filename=\"rosa.vcf\"",
            "cache_control": "no-cache"
          },
          {
            "operation": "s3_copy",
            "source_file": "rosa.vcf",
            "destination_key": "rosa.vcf.",
            "content_type": "text/vcard",
            "content_disposition": "attachment; filename=\"rosa.vcf\"",
            "cache_control": "no-cache"
          },
          {
            "operation": "s3_sync",
            "source_directory": ".",
            "destination_prefix": "",
            "exclude": ["*"],
            "include": ["*.html"],
            "cache_control": "no-cache,max-age=0,must-revalidate"
          }
        ]

  finalize-development:
    if: github.ref == 'refs/heads/develop'
    needs: deploy-development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
      url: https://www-dev.rosa.bot
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/github-actions-deploy-dev
          aws-region: us-east-1

      - name: Verify S3 deployment and refresh development CloudFront
        env:
          BUCKET: www-dev.rosa.bot
          DISTRIBUTION: E1FOKZO6RWD12W
          EXPECTED_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
        run: |
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$actual_account" == "$EXPECTED_ACCOUNT" ]] || { echo "Wrong AWS account: $actual_account" >&2; exit 1; }
          origin="$(aws cloudfront get-distribution --id "$DISTRIBUTION" --query 'Distribution.DistributionConfig.Origins.Items[0].DomainName' --output text)"
          [[ "$origin" == "$BUCKET.s3.amazonaws.com" ]] || { echo "Unexpected CloudFront origin: $origin" >&2; exit 1; }
          [[ "$(aws s3api head-object --bucket "$BUCKET" --key index.html --query CacheControl --output text)" == 'no-cache,max-age=0,must-revalidate' ]]
          [[ "$(aws s3api head-object --bucket "$BUCKET" --key rosa.vcf --query ContentType --output text)" == 'text/vcard' ]]
          [[ "$(aws s3api head-object --bucket "$BUCKET" --key rosa.vcf --query ContentDisposition --output text)" == 'attachment; filename="rosa.vcf"' ]]
          aws s3 cp "s3://$BUCKET/index.html" "$RUNNER_TEMP/s3-index.html" --quiet
          grep -Fq '<meta name="robots" content="noindex, follow" />' "$RUNNER_TEMP/s3-index.html"
          invalidation="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query Invalidation.Id --output text)"
          echo "Waiting for development CloudFront invalidation $invalidation"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$invalidation"
          curl --fail --silent --show-error "https://$BUCKET/" --output "$RUNNER_TEMP/live-index.html"
          grep -Fq '<meta name="robots" content="noindex, follow" />' "$RUNNER_TEMP/live-index.html"
          echo "Development deployment verified: S3 headers/content and https://$BUCKET/ are correct"

  deploy-production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://www.rosa.bot
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Validate website search metadata and deployment artifacts
        run: |
          python3 -m unittest discover -s tests -p 'test_site*.py'
          node --test tests/test_redirect.cjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/github-actions-deploy-prod
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.3
          terraform_wrapper: false

      - name: Provision production visitor logging
        working-directory: terraform/visitor-logging
        run: |
          terraform init \
            -backend-config="bucket=terraform-state-${{ secrets.AWS_ACCOUNT_ID_PROD }}" \
            -backend-config="key=rosa-website-visitor-logging/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=terraform-state-locks-${{ secrets.AWS_ACCOUNT_ID_PROD }}"
          terraform validate
          terraform plan -input=false -var-file=env-prod.tfvars -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: Provision production HTTPS redirect
        working-directory: terraform/apex-redirect
        run: |
          terraform init \
            -backend-config="bucket=terraform-state-${{ secrets.AWS_ACCOUNT_ID_PROD }}" \
            -backend-config="key=rosa-website-apex-redirect/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=terraform-state-locks-${{ secrets.AWS_ACCOUNT_ID_PROD }}"
          terraform validate
          terraform plan -input=false -var-file=env-prod.tfvars -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: Preview production deployment
        env:
          AWS_ENV: prod
        run: ./deploy.sh --dry-run

      - name: Deploy production website
        env:
          AWS_ENV: prod
        run: ./deploy.sh --apply
